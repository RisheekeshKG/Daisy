<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="45%" stop-color="#FDF3E7" />
      <stop offset="100%" stop-color="#FCE7EF" />
    </linearGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3EFE6" />
    </linearGradient>
    <radialGradient id="center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="55%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7C2D12" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="1400" height="360" fill="url(#bg)" />
  <circle cx="1180" cy="90" r="260" fill="url(#glowAmber)" />
  <circle cx="180" cy="300" r="220" fill="url(#glowRose)" />

  <!-- daisy flower mark -->
  <g transform="translate(175,180)" filter="url(#soft)">
    <g>
      <ellipse cx="0" cy="-64" rx="26" ry="50" fill="url(#petal)" stroke="#E7E2D6" stroke-width="2" />
      <ellipse cx="0" cy="64" rx="26" ry="50" fill="url(#petal)" stroke="#E7E2D6" stroke-width="2" />
      <ellipse cx="-64" cy="0" rx="50" ry="26" fill="url(#petal)" stroke="#E7E2D6" stroke-width="2" />
      <ellipse cx="64" cy="0" rx="50" ry="26" fill="url(#petal)" stroke="#E7E2D6" stroke-width="2" />
      <g transform="rotate(45)">
        <ellipse cx="0" cy="-64" rx="26" ry="50" fill="url(#petal)" stroke="#E7E2D6" stroke-width="2" />
        <ellipse cx="0" cy="64" rx="26" ry="50" fill="url(#petal)" stroke="#E7E2D6" stroke-width="2" />
        <ellipse cx="-64" cy="0" rx="50" ry="26" fill="url(#petal)" stroke="#E7E2D6" stroke-width="2" />
        <ellipse cx="64" cy="0" rx="50" ry="26" fill="url(#petal)" stroke="#E7E2D6" stroke-width="2" />
      </g>
    </g>
    <circle cx="0" cy="0" r="44" fill="url(#center)" stroke="#B45309" stroke-width="3" />
    <circle cx="-14" cy="-6" r="4" fill="#78350F" />
    <circle cx="14" cy="-6" r="4" fill="#78350F" />
    <circle cx="-14" cy="10" r="4" fill="#78350F" />
    <circle cx="14" cy="10" r="4" fill="#78350F" />
    <circle cx="0" cy="16" r="4" fill="#78350F" />
  </g>

  <!-- wordmark -->
  <text x="330" y="168" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="96" font-weight="800" fill="url(#titleGrad)" letter-spacing="-2">Daisy</text>
  <text x="333" y="212" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#78716C" letter-spacing="0.5">A local-first, voice-driven personal hub</text>

  <!-- feature chips -->
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700">
    <g transform="translate(333,248)">
      <rect width="150" height="42" rx="21" fill="#FFFFFF" stroke="#FBBF24" stroke-width="2" />
      <text x="75" y="27" text-anchor="middle" fill="#B45309">🎙️ Voice</text>
    </g>
    <g transform="translate(497,248)">
      <rect width="150" height="42" rx="21" fill="#FFFFFF" stroke="#34D399" stroke-width="2" />
      <text x="75" y="27" text-anchor="middle" fill="#047857">📅 Calendar</text>
    </g>
    <g transform="translate(661,248)">
      <rect width="150" height="42" rx="21" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2" />
      <text x="75" y="27" text-anchor="middle" fill="#0F766E">🎵 Spotify</text>
    </g>
    <g transform="translate(825,248)">
      <rect width="150" height="42" rx="21" fill="#FFFFFF" stroke="#FB7185" stroke-width="2" />
      <text x="75" y="27" text-anchor="middle" fill="#BE123C">📬 Gmail</text>
    </g>
    <g transform="translate(989,248)">
      <rect width="176" height="42" rx="21" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2" />
      <text x="88" y="27" text-anchor="middle" fill="#6D28D9">✨ Gemini AI</text>
    </g>
  </g>
</svg>
